name: Nightly installer upgrade
# Qualifies the nightly installer candidate this branch would publish: a Docker
# installation made by the current stable installer, with seeded Notifications
# data, is updated by the candidate, interrupted at readiness and resumed:
# once with an explicit source policy (server update --sources) and once
# through the plain `ours-install update --nightly` launcher, whose npm
# lookup is answered by a loopback registry serving the unpublished candidate.
# No secrets, no commits and no publication; everything it creates on the
# ephemeral runner is removed.
on:
  pull_request:
    branches: [prerelease]
  push:
    branches: [prerelease]
permissions:
  contents: read
concurrency:
  group: installer-nightly-upgrade-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  nightly-candidate-upgrade:
    name: Nightly candidate Docker upgrade from stable
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OURS_NIGHTLY_QUALIFICATION: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci
      - name: Compute the nightly installer candidate (not committed, not published)
        run: node scripts/prepare-nightly-qualification.mjs
      - name: Update a stable Docker installation to the candidate, fail readiness, resume
        run: node scripts/verify-nightly-candidate-upgrade.mjs
  nightly-self-update:
    name: Plain `ours-install update --nightly` from stable
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OURS_NIGHTLY_QUALIFICATION: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci
      - name: Compute the nightly installer candidate (not committed, not published)
        run: node scripts/prepare-nightly-qualification.mjs
      - name: Stable launcher runs update --nightly against a loopback registry serving the candidate, fail readiness, rerun
        run: node scripts/verify-nightly-self-update.mjs
