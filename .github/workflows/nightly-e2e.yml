name: Nightly E2E
on:
  pull_request:
    branches: [main, prerelease]
    paths:
      - 'e2e/nightly/**'
      - '.github/workflows/nightly-e2e.yml'
  push:
    branches: [prerelease]
    paths:
      - 'e2e/nightly/**'
      - '.github/workflows/nightly-e2e.yml'
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'
permissions:
  contents: read
concurrency:
  group: nightly-e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: e2e/nightly
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'prerelease' || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check runner failure handling
        run: python3 -m unittest discover -s tests -p test_runner.py
      - name: Package reproducible source
        run: python3 package_suite.py
      - name: Run active suite with isolated projects
        run: python3 run_all.py --build --jobs 2 --report-dir reports/ci
      - name: Preserve reports and source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e2e/nightly/reports/
            e2e/nightly/dist/
          if-no-files-found: error
          retention-days: 14
