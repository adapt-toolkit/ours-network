name: Installer
# Required secrets: NPM_TOKEN, VERSION_BUMP_APP_ID, VERSION_BUMP_APP_PRIVATE_KEY,
# DOCKERHUB_ADAPTFRAMEWORK (Docker Hub access token, Read & Write on adaptframework/ours-runtime and
# adaptframework/ours-maintenance). Optional variable DOCKERHUB_USERNAME (default: adaptframework).
on:
  pull_request:
    branches: [main, prerelease]
  push:
    branches: [main, prerelease]
  workflow_dispatch:
concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci
      - run: npm run test:release
      - run: npm test
      - name: Run the App install command against real Docker and published images
        run: node scripts/verify-human-setup-e2e.mjs
      - name: Verify Docker gateway routes and disconnected-endpoint recovery
        env:
          OURS_TEST_DOCKER: "1"
        run: node --test packages/installer/test/gateway-docker.test.mjs
      - name: Verify the gateway stops cleanly while holding a stream
        env:
          OURS_TEST_DOCKER: "1"
        run: node --test packages/installer/test/gateway-stop.test.mjs
      - name: Verify gateway routes on the minimum supported Compose (2.35.0)
        env:
          OURS_TEST_DOCKER: "1"
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/compose-2.35"
          mkdir -p "$DOCKER_CONFIG/cli-plugins"
          curl -fsSL -o "$DOCKER_CONFIG/cli-plugins/docker-compose" https://github.com/docker/compose/releases/download/v2.35.0/docker-compose-linux-x86_64
          echo "dba1915cf2f282527f5df0cd7a94b9503047ed200317801853abe8f22c8cd493  $DOCKER_CONFIG/cli-plugins/docker-compose" | sha256sum -c
          chmod +x "$DOCKER_CONFIG/cli-plugins/docker-compose"
          docker compose version | grep -F 'v2.35.0'
          node --test packages/installer/test/gateway-docker.test.mjs
      - name: Verify Notifications recovery under the read-only state-operation contract
        env:
          OURS_TEST_DOCKER: "1"
        run: node --test packages/installer/test/notifications-recovery-docker.test.mjs
      - name: Verify non-root Docker runtime permissions
        run: node scripts/verify-docker-runtime-permissions.mjs
      - name: Verify selected registry artifacts and dependency graph
        run: node scripts/verify-release.mjs --installed
      - name: Pack and verify installer release contents
        run: |
          npm pack --workspace @ours.network/install --pack-destination "$RUNNER_TEMP" --json > "$RUNNER_TEMP/installer-pack.json"
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { execFileSync } from 'node:child_process';
          const [packed] = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'installer-pack.json')));
          const archive = path.join(process.env.RUNNER_TEMP, packed.filename);
          const read = file => execFileSync('tar', ['-xOf', archive, `package/${file}`], {encoding: 'utf8'});
          const pkg = JSON.parse(fs.readFileSync('packages/installer/package.json'));
          const channel = pkg.version.includes('-nightly.') ? 'nightly' : 'stable';
          const release = JSON.parse(fs.readFileSync(`releases/${channel}.json`));
          assert.equal(packed.name, '@ours.network/install');
          assert.equal(packed.version, release.installerVersion);
          assert.deepEqual(JSON.parse(read('assets/release.json')), release);
          assert.deepEqual(JSON.parse(read('assets/sources.json')), {
            release,
            packages: Object.fromEntries(Object.entries(release.packages).map(([name, p]) => [name, {type: 'npm', version: p.version}]))
          });
          assert.equal(read('assets/release-lock.json'), fs.readFileSync('packages/installer/assets/release-lock.json', 'utf8'));
          assert.equal(JSON.parse(read('package.json')).bin['ours-install'], 'install.mjs');
          for (const file of ['install.mjs', 'uninstall.mjs', 'lib/effects.mjs', 'assets/Dockerfile']) assert(read(file).length > 0);
          console.log(`Verified installer archive ${packed.name}@${packed.version}`);
          JS
  images-pr:
    # Pull requests build both roles' images from the materialized contexts and qualify them
    # locally; nothing is pushed and no registry credential is used.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci
      - run: node scripts/prepare-installer.mjs
      - run: node scripts/release-images.mjs plan --commit "${{ github.event.pull_request.head.sha }}" --kind release --out "$RUNNER_TEMP/image-plan.json"
      - run: echo "BAKE=$(node scripts/release-images.mjs stage --plan "$RUNNER_TEMP/image-plan.json" --out "$RUNNER_TEMP/image-contexts")" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - run: cd "$(dirname "$BAKE")" && docker buildx bake --file docker-bake.json --progress plain
      - run: node scripts/release-images.mjs qualify-local --plan "$RUNNER_TEMP/image-plan.json"

  version-bump:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Version bump
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      bumped: ${{ steps.bump.outputs.bumped }}
      new-sha: ${{ steps.bump.outputs.new-sha }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.VERSION_BUMP_APP_ID }}
          private-key: ${{ secrets.VERSION_BUMP_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Compute and commit stable installer version
        id: bump
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/bump-installer-version.mjs stable --commit

  nightly-version:
    # The ephemeral nightly version is computed ONCE; images and npm use the same files.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/prerelease'
    runs-on: ubuntu-latest
    name: Resolve nightly version
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Compute ephemeral nightly installer version
        run: node scripts/bump-installer-version.mjs nightly
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            packages/installer/package.json
            package-lock.json
            releases/nightly.json
          if-no-files-found: error

  images:
    # main: release images for a version bump, otherwise an immutable commit snapshot.
    # prerelease: release images for the ephemeral nightly version.
    needs: [test, version-bump, nightly-version]
    if: >-
      always() && github.event_name == 'push' && needs.test.result == 'success' &&
      ((github.ref == 'refs/heads/main' && needs.version-bump.result == 'success') ||
       (github.ref == 'refs/heads/prerelease' && needs.nightly-version.result == 'success'))
    runs-on: ubuntu-latest
    name: Build, qualify and tag images
    timeout-minutes: 60
    env:
      RELEASE_SHA: ${{ github.ref == 'refs/heads/main' && needs.version-bump.outputs.new-sha || github.sha }}
      IMAGE_KIND: ${{ (github.ref == 'refs/heads/prerelease' || needs.version-bump.outputs.bumped == 'true') && 'release' || 'snapshot' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - if: github.ref == 'refs/heads/prerelease'
        uses: actions/download-artifact@v4
        with:
          name: release-files
          path: .
      - run: npm ci
      - run: node scripts/prepare-installer.mjs
      - run: node scripts/release-images.mjs plan --commit "$RELEASE_SHA" --kind "$IMAGE_KIND" --out image-plan.json
      - name: Require the Docker Hub publication credential
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_ADAPTFRAMEWORK }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::missing DOCKERHUB_ADAPTFRAMEWORK: add a Docker Hub access token (Read & Write on adaptframework/ours-runtime and adaptframework/ours-maintenance) as a repository secret. No image or installer is published."
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || 'adaptframework' }}
          password: ${{ secrets.DOCKERHUB_ADAPTFRAMEWORK }}
      - name: Reuse a complete published pair from an earlier attempt, if any
        id: existing
        run: echo "mode=$(node scripts/release-images.mjs existing --plan image-plan.json --out image-reuse.json)" >> "$GITHUB_OUTPUT"
      - name: Build both roles from materialized contexts and push by digest
        if: steps.existing.outputs.mode == 'build'
        run: |
          bake="$(node scripts/release-images.mjs stage --plan image-plan.json --out "$RUNNER_TEMP/image-contexts" --push)"
          (cd "$(dirname "$bake")" && docker buildx bake --file docker-bake.json --metadata-file "$GITHUB_WORKSPACE/image-metadata.json" --progress plain)
      - run: node scripts/release-images.mjs describe --plan image-plan.json --metadata image-metadata.json --reuse image-reuse.json --out images.json
      - name: Qualify anonymously (fresh Docker config, pull by digest, pair and runtime checks)
        run: node scripts/release-images.mjs qualify --plan image-plan.json --images images.json
      - name: Write immutable tags
        run: node scripts/release-images.mjs tag --plan image-plan.json --images images.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-images
          path: |
            image-plan.json
            images.json
          if-no-files-found: error

  npm-publish:
    needs: [test, version-bump, images]
    if: needs.version-bump.outputs.bumped == 'true' && needs.images.result == 'success'
    runs-on: ubuntu-latest
    name: Publish stable installer
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-bump.outputs.new-sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: node scripts/verify-release.mjs
      - uses: actions/download-artifact@v4
        with:
          name: release-images
          path: ${{ runner.temp }}/release-images
      - run: cp "$RUNNER_TEMP/release-images/images.json" packages/installer/assets/images.json
      - name: Pack immutable product manifest
        run: npm pack --workspace @ours.network/install --pack-destination "$RUNNER_TEMP"
      - name: Verify the packed image descriptor is the qualified one
        run: node scripts/release-images.mjs verify-pack --plan "$RUNNER_TEMP/release-images/image-plan.json" --images "$RUNNER_TEMP/release-images/images.json" --archive "$(ls "$RUNNER_TEMP"/ours.network-install-*.tgz)"
      - name: Publish guarded stable installer
        run: |
          bash .github/workflows/scripts/publish-guard.sh stable packages/installer/package.json latest
          npm publish "$RUNNER_TEMP"/ours.network-install-*.tgz --tag latest --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  nightly-publish:
    needs: [test, nightly-version, images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/prerelease' && needs.images.result == 'success'
    runs-on: ubuntu-latest
    name: Publish nightly installer
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: .
      - run: npm ci
      - run: node scripts/verify-release.mjs
      - uses: actions/download-artifact@v4
        with:
          name: release-images
          path: ${{ runner.temp }}/release-images
      - run: cp "$RUNNER_TEMP/release-images/images.json" packages/installer/assets/images.json
      - name: Pack immutable product manifest
        run: npm pack --workspace @ours.network/install --pack-destination "$RUNNER_TEMP"
      - name: Verify the packed image descriptor is the qualified one
        run: node scripts/release-images.mjs verify-pack --plan "$RUNNER_TEMP/release-images/image-plan.json" --images "$RUNNER_TEMP/release-images/images.json" --archive "$(ls "$RUNNER_TEMP"/ours.network-install-*.tgz)"
      - name: Publish guarded nightly installer
        run: |
          bash .github/workflows/scripts/publish-guard.sh nightly packages/installer/package.json nightly
          npm publish "$RUNNER_TEMP"/ours.network-install-*.tgz --tag nightly --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
